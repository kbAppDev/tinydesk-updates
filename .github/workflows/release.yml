name: Build and release Flare Image Compressor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release-request.txt]
permissions:
  contents: write
concurrency:
  group: flare-image-release
  cancel-in-progress: false
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Render suite icon
        run: python make_assets.py
      - name: Test compression and updates
        run: python -m unittest discover -s tests -v
      - name: Verify desktop workflow
        run: python tests/ui_smoke.py
      - name: Locate Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
          }
      - name: Build installer and backups
        run: python build_release.py
      - name: Verify bundled app
        shell: pwsh
        run: |
          $taskCheck = Start-Process -FilePath '.\dist\FlareImageCompressor\FlareImageCompressor.exe' -ArgumentList '--self-check','bundle-check.json' -WindowStyle Hidden -PassThru -Wait
          if ($taskCheck.ExitCode -ne 0) { throw 'Bundled app verification failed.' }
          Get-Content bundle-check.json
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $taskVersion = (Get-Content release-request.txt -Raw).Trim()
          $taskConfiguredVersion = python -c "from updater import VERSION; print(VERSION)"
          if ($taskConfiguredVersion.Trim() -ne $taskVersion) { throw 'Version mismatch.' }
          gh release view "v$taskVersion" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Already released.'; exit 0 }
          gh release create "v$taskVersion" release/* --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Flare Tools - Image Compressor $taskVersion" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
